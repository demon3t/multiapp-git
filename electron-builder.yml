appId: com.mgit.desktop
productName: mGit
publish: null
directories:
  output: release
files:
  - dist/core/**
  - dist/main.js
  - dist/preload.js
  - dist/cli.js
  - dist/ui/**
win:
  target: nsis
  icon: build/icon.ico
  signExecutable: false
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: mGit-Windows-x64-Setup.${ext}
  allowToChangeInstallationDirectory: true
  oneClick: false
